<!DOCTYPE html>
<html>
<head>
<title>Feedback Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b') no-repeat center;
    background-size: cover;
}

.form-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    margin-top: 70px;
}
</style>
</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-6 form-box shadow">

<h2 class="text-center">Student Feedback Form</h2>

<p class="text-muted text-center">
Please provide honest feedback to help improve academic quality.
</p>

<form action="submit.php" method="POST">

<input type="text" name="name" class="form-control mb-3" placeholder="Student Name" required>

<input type="email" name="email" class="form-control mb-3" placeholder="Email ID" required>

<textarea name="message" class="form-control mb-3" rows="5" placeholder="Write your feedback here..." required></textarea>

<button class="btn btn-primary w-100">Submit Feedback</button>

</form>

</div>

</div>

</div>

</body>
</html>
